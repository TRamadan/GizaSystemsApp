<!-- app.component.html -->
<div class="app-container" #sectionRef>
  <main class="main-content">
    <div class="container-fluid g-0">
      <div class="row g-0">
        <div class="col-12 g-0">
          <header class="d-flex flex-column justify-content-around align-items-center py-3">
            <img src="assets/images/logo.png" alt="Giza Systems" class="logo-img">


            <button class="hamburger" class="hamburger" (click)="toggleSidebar()" [class.active]="isSidebarOpen"
              aria-label="Menu">
              <span class="hamburger-box">
                <span class="hamburger-inner"></span>
              </span>
            </button>
            <div class="follow-us"> Follow Us</div>

          </header>

          <section class="hero-section">
            <div class="hero-content">
              <h1 class="hero-title">Transform Urban Living with GS Group’s
                Smart City Command & Control Center </h1>
              <!-- <p class="hero-subtitle">Powering the future with innovative solutions</p> -->
              <div class="text-center mb-4">
                <button class="hero-btn">Schedule Meeting</button>
              </div>

            </div>
            <div class="hero-image">
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <!-- Overlay -->
  <div class="sidebar-overlay" #overlay (click)="onOverlayClick()">
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" #sidebar>
    <div class="sidebar-header">
      <button class="sidebar-close btn" (click)="toggleSidebar()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a href="#" class="nav-link" (click)="toggleSidebar()">
            <span class="nav-title">Home</span>
            <small class="nav-subtitle">Hello!</small>
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link" (click)="toggleSidebar()">
            <span class="nav-title">About Us</span>
            <small class="nav-subtitle">All About Us</small>
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link" (click)="toggleSidebar()">
            <span class="nav-title">Industries & Solutions</span>
            <small class="nav-subtitle">Our Areas of Expertise</small>
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link" (click)="toggleSidebar()">
            <span class="nav-title">Careers</span>
            <small class="nav-subtitle">Join Our Team</small>
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link" (click)="toggleSidebar()">
            <span class="nav-title">Contact Us</span>
            <small class="nav-subtitle">Reach Out</small>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Search Section -->
    <div class="sidebar-search">
      <div class="search-container">
        <input type="text" class="form-control search-input" placeholder="Search">
        <button class="search-btn btn">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>

    <!-- Social Links -->
    <div class="sidebar-footer">
      <div class="social-links">
        <a href="#" class="social-link">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="#" class="social-link">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="#" class="social-link">
          <i class="fab fa-linkedin-in"></i>
        </a>
      </div>
    </div>
  </aside>
</div>
