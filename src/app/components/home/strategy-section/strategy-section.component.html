<div class="container my_8">
  <div class="row">
    @for(item of allStrategies; track item;let i = $index, first = $first, last = $last, even = $even, odd = $odd){
    <div class="col-md-6 d-flex  gap-1 p-0 px-2 " [ngClass]="{ 'justify-content-end': even ,'mb-3': (allStrategies.length -2) > i}">
      <div class="card">
        <img [src]="item.img" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">{{item.title}}</h5>
          <p class="card-text">{{item.description}}.</p>
        </div>
      </div>
    </div>
    }
  </div>

  <div class="row my_60">
    <div class="col-md-12  text-center">
      <span class="me-3 fs-5">
        Find out more about our Strategy as a Service
      </span>
      <button class="xb" (click)="goToRequestTransformForm(content)">
        Download Now
      </button>
    </div>
  </div>
</div>

<!-- here is the dialog to open the form -->
<ng-template #content let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Download Now</h4>
    <button type="button" class="btn-close bg-light" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>
  <div class="modal-body m-0 p-0">
    <app-request-transform-form [isDefault]="false" ></app-request-transform-form>
  </div>
</ng-template>
