<div class="container-fluid p-0">
  <section class="contact-section">
    <div class="container">
      <div class="row align-items-center">
        <!-- Left side - Content -->
        <div class="col-lg-6 col-md-12">
          <div class="content-text fade-in">
            <h1>Ready to Transform<br>Your Business?</h1>
            <p class="subtitle">Request a Meeting</p>
          </div>
        </div>

        <!-- Right side - Form -->
        <div class="col-lg-6 col-md-12">
          <div class="form-container fade-in delay">
            <form action="#">
              <div class="form-group row">
                <label for="fname" class="control-label col-sm-2">First Name</label>
                <div class="col-sm-10">
                  <input type="text" class="form-control" id="fname" placeholder="First name">
                </div>
              </div>
              <div class="form-group row">
                <label for="lname" class="control-label col-sm-2">Last Name</label>
                <div class="col-sm-10">
                  <input type="text" class="form-control" id="lname" placeholder="Last name">
                </div>
              </div>
              <div class="form-group row">
                <label for="email" class="control-label col-sm-2">Email</label>
                <div class="col-sm-10">
                  <input type="email" class="form-control" id="email" placeholder="Your email">
                </div>
              </div>
              <div class="form-group row">
                <label for="password" class="control-label col-sm-2">Password</label>
                <div class="col-sm-10">
                  <input type="email" class="form-control" id="password" placeholder="Your password">
                </div>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>
