<section id="request-transform-form" class="contact-form-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-5 d-flex flex-column justify-content-center mb-4 mb-lg-0">
        <div class="text-center text-lg-start text-justify-lg">
          <h2>Ready to Transform <br>Your Business?</h2>
          <p class="mt-3">Request a Meeting</p>
        </div>
      </div>

      <div class="col-lg-7">
        <form [formGroup]="form">
          <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Name*</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" formControlName="name">
            </div>
          </div>
          <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Email*</label>
            <div class="col-sm-9">
              <input type="email" class="form-control" formControlName="email">
            </div>
          </div>
          <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Phone*</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" formControlName="phone">
            </div>
          </div>
          <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Company*</label>
            <div class="col-sm-9">
              <input type="text" class="form-control" formControlName="company">
            </div>
          </div>
          <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Interested Solution(s):</label>
            <div class="col-sm-9">
              <ng-select [items]="solutions" [multiple]="true" bindLabel="label" bindValue="value"
                formControlName="solution"></ng-select>
              <!-- <select class="form-select" formControlName="solution">
                <option selected disabled>Select a Solution</option>
                <option>Solution 1</option>
                <option>Solution 2</option>
                <option>Solution 3</option>
              </select> -->
            </div>
          </div>
          <div class="mb-3 row">
            <label class="col-sm-3 col-form-label">Message:</label>
            <div class="col-sm-9">
              <textarea class="form-control" rows="3" formControlName="message"></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>


<!-- Submit Button Outside -->
<div class="submit-area d-flex justify-content-end me-5 py-4">
  <button type="submit" [disabled]="form.invalid" class="btn-submit" (click)="createFormRequest()">Submit</button>
</div>
