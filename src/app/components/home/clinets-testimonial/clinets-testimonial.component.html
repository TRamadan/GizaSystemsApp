<div class="container p-4">
  <div class="row">
    <div class="col-md-12 text-center">
      <h4 class="section-title my-5">
        Testimonials Client Results
      </h4>
    </div>
  </div>


  <div class="row g-4">
    @for(t of testimonials; track t;){
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm p-5 d-flex flex-column">

        <!-- Stars -->
        <div class="mb-2 text-danger">
          @for(star of [].constructor(t.rating); track star) {
          <ng-container>
            ★
          </ng-container>
          }

          @for(star of [].constructor(5 - t.rating); track star){
          <ng-container>
            ☆
          </ng-container>
          }
        </div>

        <!-- Feedback -->
        <p class="flex-grow-1">"{{ t.feedback }}"</p>

        <!-- Name & Company fixed at bottom -->
        <div class="d-flex align-items-center mt-auto">
          <div class="rounded-circle bg-dark me-2" style="width: 32px; height: 32px;"></div>
          <div>
            <strong>{{ t.name }}</strong><br>
            <small class="text-secondary">{{ t.company }}</small>
          </div>
        </div>

      </div>
    </div>
    }
  </div>



  <div class="row mt-4">
    <div class="col-md-12 text-center">
      <h4 class="section-title">
        From Efficiency Gains to Strategic Growth
      </h4>
    </div>
  </div>
